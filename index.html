<title>Roots Attendance</title>
<style>
:root{
  --bg:#0a0f0a;--surface:#111811;--surface2:#182418;
  --border:rgba(244,196,48,.16);--border2:rgba(244,196,48,.45);
  --gold:#f4c430;--gold2:#ffd700;--cream:#e8e0c8;--muted:#a3b3a3;
  --ok:#3E9E63;--bad:#E0574B;--ok-t:#52b878;--bad-t:#f0786c;--azure:#6EA8FE;
  --r:4px;--ease:cubic-bezier(.22,.61,.36,1);
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
::selection{background:var(--gold);color:#000}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.panel,#composer{scroll-margin-top:var(--railh,120px)}
::placeholder{color:#8fa08f;opacity:1}
.hide{display:none!important}

/* ambient */
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
.vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,transparent 45%,rgba(10,15,10,.78) 100%)}
body.calm #particles,body.calm .grain{display:none}
body.calm *{animation:none!important}body.calm .crest:hover img{transform:none}

.wrap{position:relative;z-index:10;max-width:1040px;margin:0 auto;padding:0 20px calc(var(--tabh) + 90px + env(safe-area-inset-bottom))}

/* rail */
.rail{position:sticky;top:0;z-index:30;background:rgba(10,15,10,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s;margin:0 -20px;padding:calc(10px + env(safe-area-inset-top)) 20px 10px}
.rail[data-scrolled="true"]{border-bottom-color:var(--border)}
.rail-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.crest{width:38px;height:44px;flex:0 0 auto;display:grid;place-items:center;perspective:420px}
.crest img{width:100%;height:auto;display:block;transform-style:preserve-3d;filter:drop-shadow(0 0 8px rgba(244,196,48,.28));transition:transform .5s var(--ease)}
.crest:hover img{transform:rotateY(180deg)}
.brand .wm{font-size:19px;font-weight:800;letter-spacing:.09em;line-height:1}
.brand .sub{font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:4px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;font-size:10.5px;letter-spacing:.1em;font-variant-numeric:tabular-nums;white-space:nowrap;text-transform:uppercase}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.pill .lb{color:var(--muted)}.pill .vl{font-weight:700;font-size:11px}
.pill.gold{color:var(--gold)}.pill.ok{color:var(--ok-t)}.pill.bad{color:var(--bad-t)}.pill.live .dot{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.clockbox{text-align:right}
.clock{font-size:18px;font-weight:600;letter-spacing:.07em;font-variant-numeric:tabular-nums;color:var(--gold);line-height:1}
.cdate{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.calm-b{padding:8px 11px;min-height:34px;border:1px solid var(--border2);font-size:10.5px;letter-spacing:.13em;color:var(--muted);border-radius:var(--r);text-transform:uppercase}
.calm-b:hover{color:var(--gold);border-color:var(--border2)}
.calm-b[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:rgba(244,196,48,.08)}

/* top tabs (desktop) */
.tabs{display:flex;gap:4px;margin:14px 0 4px;border-bottom:1px solid var(--border)}
.tabs button{padding:14px 16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .18s,border-color .18s}
.tabs button:hover{color:var(--cream)}
.tabs button.on{color:var(--gold);border-color:var(--gold)}

/* bottom tab bar (mobile) */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(10,15,10,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border2);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;max-width:520px;margin:0 auto}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;color:var(--muted);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border-radius:var(--r);position:relative;min-height:48px}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--gold)}
.tabbar button.on::before{content:"";position:absolute;top:-7px;left:26%;right:26%;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.tabbar .badge{position:absolute;top:2px;right:24%;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--gold);color:#000;font-size:9.5px;font-weight:800;letter-spacing:0;display:grid;place-items:center}

/* telemetry line */
.telem{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:14px;font-variant-numeric:tabular-nums}
.telem b{color:var(--cream);font-weight:600}.telem .g{color:var(--gold)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px;position:relative}
.ph{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:-2px 0 12px}
.ph .dot{width:6px;height:6px;border-radius:50%;background:var(--bad)}
.ph .dot.g{background:var(--gold)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--cream);background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:10px 11px;min-width:0;transition:border-color .18s,box-shadow .18s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,196,48,.1)}
input[type=date]{color-scheme:dark}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--gold)}
select{color-scheme:dark}
textarea{width:100%;min-height:170px;line-height:1.65;resize:vertical}
.mute{color:var(--muted);font-size:12.5px}
label{display:block;font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:12px 0 5px}
label.inl{display:flex;align-items:center;gap:8px;margin:0;font-size:10.5px}

.btn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--border2);color:var(--cream);padding:11px 15px;border-radius:var(--r);transition:all .18s;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;font-weight:600}
.btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 18px rgba(244,196,48,.1)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--gold);color:#0a0f0a;border-color:var(--gold)}
.btn.p:hover{background:var(--gold2);color:#000;box-shadow:0 0 22px rgba(244,196,48,.35)}
.btn.s{padding:7px 12px;min-height:36px;font-size:10.5px}
.btn.dgr{color:var(--bad-t);border-color:rgba(224,87,75,.35)}
.btn.dgr:hover{background:rgba(224,87,75,.1);border-color:var(--bad);color:var(--bad-t)}
.ripple{position:absolute;border-radius:50%;background:rgba(244,196,48,.35);transform:scale(0);animation:rip .55s var(--ease) forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.chip.bad{color:var(--bad-t);border-color:rgba(224,87,75,.35);background:rgba(224,87,75,.08)}
.chip.warn{color:var(--gold);border-color:var(--border2);background:rgba(244,196,48,.07)}
.chip.ok{color:var(--ok-t);border-color:rgba(62,158,99,.4);background:rgba(62,158,99,.08)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;text-align:left;position:relative;overflow:hidden;transition:border-color .18s,transform .18s,box-shadow .18s;display:block;width:100%}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1;color:var(--cream);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat span{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--border2);transition:background .18s}
button.stat:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 8px 24px -12px rgba(244,196,48,.25)}
button.stat[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 26px rgba(244,196,48,.16);background:linear-gradient(180deg,rgba(244,196,48,.07),var(--surface))}
button.stat[aria-pressed="true"]::after{background:var(--gold)}
button.stat[aria-pressed="true"] b{color:var(--gold)}
.stat.t-bad b{color:var(--bad-t)}.stat.t-warn b{color:var(--gold)}

/* kid rows */
.kid{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);position:relative;transition:background .25s}
.kid:last-child{border-bottom:0}
.kid.flash{animation:flash .7s var(--ease)}
@keyframes flash{0%{background:rgba(244,196,48,.18)}100%{background:transparent}}
.kid.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.kid .who{min-width:0;flex:1 1 130px}
.kid .nm{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid .meta{color:var(--muted);font-size:12.5px;letter-spacing:.04em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gauge{width:76px;flex:0 0 auto}
.gauge .gl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px;font-variant-numeric:tabular-nums}
.gauge .gt{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.gauge .gf{height:100%;border-radius:99px;background:var(--ok);transition:width .5s var(--ease)}
.gauge.warn .gf{background:var(--gold)}.gauge.bad .gf{background:var(--bad)}
.gauge.unk .gt{border-style:dashed;background:transparent}
.gauge.bad .gl b{color:var(--bad-t)}.gauge.warn .gl b{color:var(--gold)}
.tog{display:flex;gap:6px;flex:0 0 auto}
.tog button{width:78px;min-height:44px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border2);border-radius:var(--r);color:var(--cream);transition:all .15s;position:relative;overflow:hidden;font-weight:700}
.tog button:hover{color:var(--cream);border-color:var(--gold)}
.tog button:active{transform:scale(.95)}
.tog button.on.pres{background:#267a48;color:#fff;border-color:#267a48;box-shadow:0 0 18px rgba(62,158,99,.4)}
.tog button.on.abs{background:#c0392b;color:#fff;border-color:#c0392b;box-shadow:0 0 18px rgba(224,87,75,.35)}
.kid[data-pickrow]{cursor:pointer}.kid[data-pickrow]:focus-visible{outline-offset:-2px}
.kid.sel{background:rgba(244,196,48,.06);box-shadow:inset 2px 0 0 var(--gold)}

/* filter chips + group chips */
.fchips{display:flex;gap:6px;overflow-x:auto;padding:3px 3px 6px;margin:0 -2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fchips::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border2);border-radius:999px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:all .18s;min-height:40px}
.fc:hover{color:var(--cream);border-color:var(--gold)}
.fc[aria-pressed="true"]{color:#0a0f0a;background:var(--gold);border-color:var(--gold);font-weight:700}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(244,196,48,.15) 0);display:grid;place-items:center;flex:0 0 auto;transition:background .4s}
.ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--bg)}
.fc[aria-pressed="true"] .ring{background:conic-gradient(#0a0f0a calc(var(--p)*1%),rgba(0,0,0,.2) 0)}
.fc[aria-pressed="true"] .ring::after{background:var(--gold)}
.fc.done .ring{background:var(--ok)}
.fc small{font-size:10.5px;opacity:.85;font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* dialog */
dialog{border:1px solid var(--border2);border-radius:var(--r);background:var(--surface);color:var(--cream);max-width:480px;width:calc(100% - 28px);padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);max-height:92vh;overflow:auto}
dialog[open]{animation:dlg .25s var(--ease)}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(5,10,5,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h2{margin:0 0 4px;font-size:17px;letter-spacing:.04em}
dialog input:not([type=checkbox]),dialog select{width:100%}

/* toast + confetti */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--gold);color:var(--cream);padding:11px 15px;border-radius:var(--r);font-size:12.5px;letter-spacing:.03em;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:tin .3s var(--ease);text-align:center}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.confetti{position:fixed;width:8px;height:8px;z-index:90;pointer-events:none;border-radius:1px}

/* intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;perspective:700px;transition:opacity .4s var(--ease)}
.intro img{width:88px;transform-style:preserve-3d;animation:crestin .8s var(--ease) forwards;filter:drop-shadow(0 0 24px rgba(244,196,48,.4))}
.intro .t{position:absolute;bottom:38%;font-size:10px;letter-spacing:.4em;color:var(--muted);opacity:0;animation:fin .6s .5s forwards}
@keyframes crestin{0%{transform:rotateY(-95deg) scale(.82);opacity:0}55%{opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}
@keyframes fin{to{opacity:1}}
.intro[data-out="true"]{opacity:0;pointer-events:none}

/* view enter */
.view{animation:vin .32s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

@media (max-width:700px){
  .wrap{padding-left:12px;padding-right:12px}
  .rail{margin:0 -12px;padding-left:12px;padding-right:12px}
  .tabs{display:none}
  .tabbar{display:block}
  .brand .wm{font-size:16px}.brand .sub{display:none}
  .crest{width:30px;height:36px}
  .rail-in{gap:8px 10px}
  .brand{order:1;flex:1 1 auto}
  .clockbox{order:2}.clockbox .cdate{display:none}.clock{font-size:15px}
  #campPill{order:5;flex:1 1 auto;justify-content:center;padding:5px 10px;max-width:100%;white-space:normal}
  .calm-b{order:3}
  #sync{order:4;padding:5px 10px}
  #syncwarn{position:sticky;top:0;z-index:60;background:#a8312a;color:#fff;font-size:13px;font-weight:600;line-height:1.35;padding:9px 14px;text-align:center}
  #syncwarn[hidden]{display:none}
  .telem{flex-wrap:nowrap;overflow-x:auto;gap:14px;font-size:10px;padding:8px 0;margin-bottom:10px;scrollbar-width:none;white-space:nowrap}
  .telem::-webkit-scrollbar{display:none}
  .kid[data-pickrow] .hint{display:none}
  .kid{flex-wrap:wrap;gap:10px 12px;padding:14px 4px}
  .kid .who{flex:1 1 120px}
  .kid .btn.s{flex:0 0 auto}
  .btn,.btn.s,.fc,.calm-b,select,dialog .btn{min-height:44px}
  label.inl{padding:10px 0}input[type=checkbox]{width:22px;height:22px}
  .stats .stat:last-child:nth-child(odd){grid-column:1/-1}
  .gauge{margin-left:auto}
  .tog{width:100%}.tog button{flex:1;width:auto;min-height:48px;font-size:11.5px}
  .gauge{width:88px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat b{font-size:26px}
  .panel{padding:12px}
  .btn{flex:1 1 auto}
}
@media (min-width:701px) and (max-width:900px){
  .rail-in{gap:8px 10px}.brand{order:1;flex:1 1 auto}.clockbox{order:2}.clockbox .cdate{display:none}
  #campPill{order:5;flex:1 1 auto;justify-content:center}#sync{order:4}.calm-b{order:3}
}
@media (min-width:701px){.toasts{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

/* ---------- state + shared store ---------- */
const okState=o=>o&&Array.isArray(o.kids)&&o.kids.every(k=>k&&typeof k.id==='string'&&typeof k.name==='string'&&Array.isArray(k.log)&&k.log.every(x=>x&&typeof x.d==='string'&&typeof x.s==='string')&&Array.isArray(k.msgs)&&k.msgs.every(x=>x&&typeof x.d==='string')&&Array.isArray(k.renewals)&&k.renewals.every(x=>x&&typeof x.d==='string')&&k.hist&&typeof k.hist==='object'&&Number.isFinite(k.hist.a)&&Number.isFinite(k.hist.t));
let S = load();
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(okState(o)) return o; } }catch(e){}
  return {kids: SEED.map((k,i)=>({id:'k'+i,name:k.n,parent:'',note:'',hist:{a:k.a||0,t:k.t||0},free:k.a==null,
    stopped:k.stop,ending:k.end,pay:k.pay,bal:null,log:[],msgs:[],renewals:[]})), v:1};
}
let SERVER=false, pushTimer=null, lastPushed='', dirty=false;
try{ dirty=localStorage.getItem(KEY+'-dirty')==='1'; }catch(e){}
/* Log entries: one per date, {d,s:'P'|'A'|'-',t,dec}. '-' is a tombstone (undone mark) so undo survives syncing. */
const liveEntry=(k,d)=>k.log.find(l=>l.d===d&&l.s!=='-');
const decCount=log=>log.filter(x=>x.s==='P'&&x.dec).length;
function mergeKid(a,b){                       // a = local, b = remote
  const base=((b.u||0)>(a.u||0))?b:a, other=base===a?b:a;   // scalars (name, flags, notes) come from the most recently edited copy
  const byDate=new Map(); [...base.log,...other.log].forEach(x=>{ const c=byDate.get(x.d); if(!c||(x.t||0)>(c.t||0)) byDate.set(x.d,x); });
  const log=[...byDate.values()];
  let bal=base.bal;
  if(bal!=null){ const delta=decCount(log)-decCount(base.log); bal=Math.max(0,bal-delta); }   // apply the other device's marks/undos to the balance
  const msgs=[...base.msgs]; other.msgs.forEach(x=>{ if(!msgs.some(y=>y.d===x.d&&y.t===x.t)) msgs.push(x); });
  const renewals=[...base.renewals]; other.renewals.forEach(x=>{ if(!renewals.some(y=>y.d===x.d&&y.n===x.n)) renewals.push(x); });
  return {...base,bal,log,msgs,renewals};
}
function mergeExtras(a,b){ const r={...(a||{})}; for(const d in (b||{})){ if(!r[d]||(b[d].u||0)>(r[d].u||0)) r[d]=b[d]; } return r; }   // trials + late arrivals, newest edit per date wins
function mergeState(loc,rem){
  const lg=loc.gen||0, rg=rem.gen||0;                        // gen = a deliberate Reset/Import: the newer one wins whole
  if(lg>rg) return loc; if(rg>lg) return rem;
  const del=[...new Set([...(loc.deleted||[]),...(rem.deleted||[])])];
  const byId=new Map(rem.kids.map(k=>[k.id,k])), kids=[];
  loc.kids.forEach(k=>{ const r=byId.get(k.id); byId.delete(k.id); if(del.includes(k.id)) return; kids.push(r?mergeKid(k,r):k); });
  byId.forEach(k=>{ if(!del.includes(k.id)) kids.push(k); });
  return {...loc,kids,deleted:del,extras:mergeExtras(loc.extras,rem.extras)};
}
function save(){
  dirty=true;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); localStorage.setItem(KEY+'-dirty','1'); }catch(e){}
  if(SERVER){ status('saving'); clearTimeout(pushTimer); pushTimer=setTimeout(push,250); }
}
let pushing=false, again=false;
async function push(){ return; /* LOCAL-ONLY */
  if(pushing){ again=true; return; }
  pushing=true;
  let n=0;
  try{ do{ again=false; await pushOnce(); }while(again&&++n<6); } finally{ pushing=false; }
}
async function pushOnce(){
  let et='"none"';
  try{                                                        // read, merge, then write with If-Match, so another device's edits are never overwritten
    const g=await fetch('/api/state',{cache:'no-store'});
    if(g.ok){ et=g.headers.get('ETag')||'"none"'; let o=null; try{ o=JSON.parse(await g.text()); }catch(e){}
      if(okState(o)){ const before=JSON.stringify(S); S=mergeState(S,o); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
        if(JSON.stringify(S)!==before){ const ae=document.activeElement; if(!$('#dlg').open&&!(ae&&/^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName))) render(); } } }
    else if(g.status===404){ et='"none"'; }
    else { status(false); return; }
  }catch(e){ status(false); return; }
  const body=JSON.stringify(S);
  try{
    const r=await fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json','If-Match':et},body});
    if(r.status===409){ again=true; return; }                 // another device saved in between: read and merge again
    if(r.ok){ lastPushed=body; if(JSON.stringify(S)===body){ dirty=false; try{localStorage.removeItem(KEY+'-dirty');}catch(e){} status(true); } else status('saving'); }
    else status(false);

async function pull(rerender){ return; /* LOCAL-ONLY: no server */
  try{
    const r=await fetch('/api/state',{cache:'no-store'});
    if(r.status===404){ SERVER=true; await push(); return; }
    if(!r.ok) throw 0;
    const txt=await r.text(); SERVER=true;
    let o=null; try{ o=JSON.parse(txt); }catch(e){}
    if(!okState(o)){ status(false); if(okState(S)) push(); return; }   // corrupt shared file: heal it from this device
    const ae=document.activeElement, busy=$('#dlg').open||(ae&&/^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName));
    if(dirty){
      if(txt===JSON.stringify(S)){ dirty=false; try{localStorage.removeItem(KEY+'-dirty');}catch(e){} lastPushed=txt; status(true); return; }
      await push();
      if(rerender&&!busy) render();
      return;
    }
    if(txt!==JSON.stringify(S)){
      if(busy) return;
      S=o; lastPushed=txt; try{ localStorage.setItem(KEY,txt); }catch(e){}

}

      p.x+=p.vx*33; p.y+=p.vy*33; p.ph+=.02;

     ${card('nobal','Balance not set',cnt('nobal'),'t-warn')}
   </div>
   <div class="row" style="margin-bottom:10px"><input class="grow" id="q" aria-label="Search kids" style="flex:1 1 140px" placeholder="${SEARCH_PH}" value="${esc(q)}" autocomplete="off"><button class="btn p" id="add">+ Add kid</button></div>
   <div class="panel"><div class="ph"><span class="dot g"></span>${f?esc(f.label):'All members'} · ${rows.length} ${rows.length===1?'kid':'kids'}${f?' <button class="btn s" id="clr" style="margin-left:auto">Show all</button>':''}</div>
   ${rows.map(k=>{const g=group(k);return `<div class="kid" data-id="${k.id}">
      <div class="who"><div class="nm">${esc(k.name)}</div><div class="meta">${rateTxt(k)} · ${GN[g]}</div></div>
      ${gauge(k)}
      <div class="row" style="gap:6px">${k.pay?'<span class="chip bad">💰 payment</span>':''}${k.stopped?'<span class="chip">❌ stopped</span>':''}</div>
      <button class="btn s" data-e="1" style="margin-left:auto">Edit</button></div>`;}).join('')||'<div class="empty">Nobody in this list</div>'}</div>`;
  bindSearch();
  $('#main').querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{ const key=b.dataset.mf||null; mf=(mf===key)?null:key; render(); if(mf) $('#main .panel').scrollIntoView({behavior:CALM()?'auto':'smooth',block:'start'}); });
  const clr=$('#clr'); if(clr) clr.onclick=()=>{mf=null;render();};
  $('#add').onclick=()=>{const n=(prompt('Kid name')||'').trim();if(!n)return;S.kids.push({id:'k'+Date.now(),name:n,parent:'',note:'',hist:{a:0,t:0},free:false,stopped:false,ending:false,pay:false,bal:null,log:[],msgs:[],renewals:[]});save();render();};
  $('#main').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(b.closest('.kid').dataset.id));
  $('#main').querySelectorAll('.kid .nm').forEach(n=>n.onclick=()=>edit(n.closest('.kid').dataset.id));
}

function edit(id){
  const k0=kid(id), d=$('#dlg'); if(!k0) return;
  d.innerHTML=`<h2>${esc(k0.name)}</h2><div class="mute">${rateTxt(k0)} · ${GN[group(k0)]}</div>
   <label for="e_nm">Name used in messages (what the parent calls the kid)</label><input id="e_nm" value="${esc(k0.name)}">
   <label for="e_p">Parent name (e.g. 王妈妈, optional)</label><input id="e_p" value="${esc(k0.parent)}">
   <label for="e_b">Classes left in package (empty = unknown)</label>
   <div class="row"><input id="e_b" type="number" inputmode="numeric" value="${k0.bal??''}" style="width:110px"><button class="btn s" id="e_r" type="button">Renewed +${PKG} (¥${PRICE})</button></div>
   <label for="e_n">Notes</label><input id="e_n" value="${esc(k0.note)}">
   <div class="row" style="margin-top:14px;gap:16px">
     <label class="inl"><input type="checkbox" id="e_s" ${k0.stopped?'checked':''}> Stopped</label>
     <label class="inl"><input type="checkbox" id="e_e" ${k0.ending?'checked':''}> Package ending</label>
     <label class="inl"><input type="checkbox" id="e_m" ${k0.pay?'checked':''}> Payment pending</label>
   </div>
   <div class="row" style="margin-top:18px;justify-content:space-between">
     <button class="btn s dgr" id="e_x" type="button">Delete</button>
     <span class="row"><button class="btn" id="e_c" type="button" autofocus>Cancel</button><button class="btn p" id="e_ok" type="button">Save</button></span>
   </div>
   ${k0.renewals.length?`<div class="mute" style="margin-top:10px">Renewals: ${k0.renewals.map(r=>r.d).join(', ')}</div>`:''}`;
  d.showModal();
  let newRen=0;
  $('#e_r').onclick=()=>{const v=$('#e_b');v.value=(parseInt(v.value)||0)+PKG;newRen++;$('#e_e').checked=false;$('#e_m').checked=false;};
  $('#e_c').onclick=()=>d.close();
  $('#e_x').onclick=()=>{ if(confirm('Delete '+k0.name+' and all their records?')){ S.kids=S.kids.filter(x=>x.id!==id); S.deleted=[...new Set([...(S.deleted||[]),id])]; save(); d.close(); render(); } };
  const snap={nm:k0.name,p:k0.parent,n:k0.note,b:k0.bal,s:!!k0.stopped,e:!!k0.ending,m:!!k0.pay};
  $('#e_ok').onclick=()=>{
    const k=kid(id); if(!k){ d.close(); render(); return; }
    // write only what was changed in this dialog, so a sync that arrived while it was open is not overwritten
    const nm=$('#e_nm').value.trim()||snap.nm; if(nm!==snap.nm) k.name=nm;
    const p=$('#e_p').value.trim(); if(p!==snap.p) k.parent=p;
    const n=$('#e_n').value; if(n!==snap.n) k.note=n;
    const bs=$('#e_b').value, nb=bs===''?null:parseInt(bs);
    if(nb!==snap.b){ k.bal=(nb!=null&&snap.b!=null&&k.bal!=null)?Math.max(0,k.bal+(nb-snap.b)):nb; }
    const s=$('#e_s').checked, e2=$('#e_e').checked, m=$('#e_m').checked;
    if(s!==snap.s) k.stopped=s; if(e2!==snap.e) k.ending=e2; if(m!==snap.m) k.pay=m;
    for(let i=0;i<newRen;i++) k.renewals.push({d:today(),n:PKG});
    k.u=Date.now();
    save(); d.close(); render();
  };
}

/* ---------- messages ---------- */
let mk=null, mt=null, mg='finished', mkManual=false;
const GROUPS=[
 {key:'finished',label:'Finished package',tpl:'finished',pick:k=>k.pay&&!k.free},
 {key:'ending',label:'Renewal due',tpl:'ending',pick:k=>!k.pay&&!k.free&&group(k)===2},
 {key:'stopped',label:'Stopped, engaged',tpl:'stopped',pick:k=>!k.pay&&!k.free&&group(k)===1},
 {key:'atrisk',label:'At risk',tpl:'atrisk',pick:k=>!k.pay&&!k.free&&group(k)===3},
 {key:'lowlast',label:'Stopped, low',tpl:'lowlast',pick:k=>!k.pay&&!k.free&&group(k)===4},
 {key:'flags',label:'Today: absent / low package',tpl:null,pick:k=>{const s=suggest(k);return s.includes('absent')||s.includes('low');}},
 {key:'healthy',label:'Healthy (no message)',tpl:null,pick:k=>k.free||(!k.pay&&group(k)===5)},
];
const MSG_DAYS=7;   // a message counts as "done" for a week, so Monday's batch is not shown as unsent on Tuesday
const sentCutoff=()=>{ const d=new Date(); d.setDate(d.getDate()-MSG_DAYS+1); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const sentToday=k=>{ const c=sentCutoff(); return k.msgs.some(m=>m.d>=c); };
function suggest(k){
  const s=[];
  const l=liveEntry(k,date);
  if(l&&l.s==='A') s.push('absent');
  if(k.bal!=null&&k.bal<=2&&!k.stopped) s.push('low');
  const g=group(k); if(k.pay&&!k.free)s.push('finished'); else if(g===1)s.push('stopped'); if(g===2&&!k.pay)s.push('ending'); if(g===3)s.push('atrisk'); if(g===4)s.push('lowlast');
  return s;
}
function fill(t,k){
  const left = k.bal==null?'[剩余课时]':k.bal;
  return t.replace(/{parent}，/g,k.parent?k.parent+'，':'').replace(/{parent}/g,k.parent||'').replace(/{kid}/g,k.name).replace(/{left_txt}/g,k.bal!=null?`，还剩${k.bal}节课`:'').replace(/{left}/g,left);
}
let lastMark=null;
function openWeChat(){
  const st=document.getElementById('mst'); let left=false;
  const onHide=()=>{ if(document.hidden) left=true; };
  document.addEventListener('visibilitychange',onHide);
  setTimeout(()=>{ document.removeEventListener('visibilitychange',onHide);
    if(!left&&st&&document.body.contains(st)){ st.textContent='Copied. If WeChat did not open, open it yourself and paste.'; st.style.color='var(--gold)'; } },1600);
  const back=()=>{ if(!document.hidden){ document.removeEventListener('visibilitychange',back);
    const s2=document.getElementById('mst'); if(s2){ s2.textContent='Back from WeChat? If you sent it, tap "Sent & next".'; s2.style.color='var(--gold)'; } } };
  document.addEventListener('visibilitychange',back);
  location.href='weixin://';
}
function vMessages(){
  const T=TEMPLATES;
  const grp=GROUPS.find(g=>g.key===mg)||GROUPS[0];
  const members=S.kids.filter(grp.pick);
  if(!mk||!kid(mk)||!members.some(x=>x.id===mk)&&!mkManual) mk=(members.find(x=>!sentToday(x))||members[0])?.id||null;
  const k=mk?kid(mk):null;
  if(k&&mt===null) mt=grp.tpl||(grp.key==='healthy'?'':(suggest(k)[0]||'low'));
  const tpl=T.find(x=>x.id===mt);
  const nextUnsent=()=>{const i=members.findIndex(x=>x.id===mk);const r=[...members.slice(i+1),...members.slice(0,i)];return r.find(x=>!sentToday(x));};
  $('#main').innerHTML=`
   <div class="fchips">${GROUPS.map(g=>{const m=S.kids.filter(g.pick),s=m.filter(sentToday).length,p=m.length?Math.round(s/m.length*100):0;
       return `<button class="fc ${m.length&&s===m.length?'done':''}" data-g="${g.key}" aria-pressed="${g.key===mg}"><span class="ring" style="--p:${p}"></span>${g.label}<small>${s}/${m.length}</small></button>`;}).join('')}</div>
   <div class="panel"><div class="ph"><span class="dot g"></span>${esc(grp.label)}${grp.tpl?' · default: '+esc(T.find(x=>x.id===grp.tpl).label):''}</div>
     ${members.map(x=>`<div class="kid ${x.id===mk?'sel':''}" data-id="${x.id}" data-pickrow="1" tabindex="0" role="button" aria-label="Open message for ${esc(x.name)}">
        <div class="who"><div class="nm">${esc(x.name)}</div><div class="meta">${x.parent?esc(x.parent):'no parent name'}</div></div>
        ${sentToday(x)?'<span class="chip ok">✓ sent '+(lastMsg(x)===today()?'today':lastMsg(x).slice(5))+'</span>':(lastMsg(x)?'<span class="chip">last '+lastMsg(x).slice(5)+'</span>':'<span class="chip warn">not contacted</span>')}
        <span class="mute hint" style="margin-left:auto">${x.id===mk?'open ▾':'tap to open'}</span></div>`).join('')||'<div class="empty">Nobody in this group</div>'}
   </div>
   ${k?`<div class="panel" id="composer"><div class="ph"><span class="dot g"></span>Compose · ${esc(k.name)}</div>
     <div class="row">
       <select id="mk" class="grow" aria-label="Kid">${S.kids.map(x=>`<option value="${x.id}" ${x.id===mk?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
       <select id="mt" class="grow" aria-label="Message template">${mt===''?'<option value="" selected>Choose a template…</option>':''}${T.map(x=>`<option value="${x.id}" ${x.id===mt?'selected':''}>${esc(x.label)}</option>`).join('')}</select>
     </div>
     <div class="mute" style="margin:10px 0 6px">${k.parent?'Parent: '+esc(k.parent)+'. ':'No parent name saved, the greeting works without one. '}Edit freely. Fill anything in [ ] with a true detail.</div>
     <textarea id="mx" lang="zh" aria-label="Message text">${tpl?esc(fill(tpl.text,k)):''}</textarea>
     <div class="row" style="margin-top:10px">
       <button class="btn p" id="cpw">Copy + open WeChat</button>
       <button class="btn" id="cp">Copy only</button>
       <button class="btn" id="cpa">Copy + package line</button>
       <button class="btn" id="mm">Sent &amp; next</button>
       <button class="btn" id="cmn">Copy, sent &amp; next</button>${lastMark?'<button class="btn" id="un">Undo last sent</button>':''}
       <button class="btn" id="sk">Skip</button>
     </div>
     <div class="mute" id="mst" style="margin-top:8px;min-height:18px" role="status"></div>
     ${k.msgs.length?`<div class="mute" style="margin-top:6px">History: ${k.msgs.slice(-5).map(m=>m.d+' '+m.t).join(' · ')}</div>`:''}
   </div>`:`<div class="panel"><div class="empty">Nothing to send in this group</div></div>`}`;
  const openKid=id=>{mk=id;mkManual=false;mt=null;render();const c=$('#composer');if(c)c.scrollIntoView({behavior:CALM()?'auto':'smooth',block:'start'});};
  $('#main').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{mg=b.dataset.g;mk=null;mt=null;mkManual=false;render();});
  $('#main').querySelectorAll('.kid[data-pickrow]').forEach(r=>{ r.onclick=()=>openKid(r.dataset.id); r.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openKid(r.dataset.id);} }; });
  if(!k) return;
  const mx=$('#mx'), fit=()=>{ mx.style.height='auto'; mx.style.height=Math.max(170,mx.scrollHeight+4)+'px'; };
  fit(); mx.addEventListener('input',fit);
  $('#mk').onchange=e=>{mk=e.target.value;mkManual=true;mt=null;render();};
  $('#mt').onchange=e=>{mt=e.target.value;render();};
  const copy=async txt=>{
    const open=/\[[^\]]+\]/.test(txt); let ok=true;
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){ mx.focus(); mx.select(); mx.setSelectionRange(0,mx.value.length); try{ ok=document.execCommand('copy'); }catch(_){ ok=false; } }
    const st=$('#mst');
    if(!ok){ st.textContent='Copy failed. The text is selected: press and hold, then tap Copy.'; st.style.color='var(--gold)'; return false; }
    st.textContent=open?'Copied, but there are still [ ] placeholders to fill in WeChat.':'Copied. Paste into WeChat.';
    st.style.color=open?'var(--gold)':'var(--ok-t)'; haptic(10); return true;
  };
  $('#cp').onclick=()=>copy(mx.value);
  $('#cpa').onclick=()=>{const kk=kid(mk)||k;const cur=mx.value;const tx=cur.includes('抵扣')?cur:cur+'\n\n'+fill(T.find(x=>x.id==='pkgline').text,kk);mx.value=tx;fit();copy(tx);};
  $('#sk').onclick=()=>{const n=nextUnsent();if(n){openKid(n.id);}else toast('No more unsent kids in this group');};
  const markSent=()=>{
    if(!mt){ toast('Choose a template first'); return false; }
    const kk=kid(mk); if(!kk) return false;
    const lab=T.find(x=>x.id===mt).label.split(' · ')[1]||mt;
    if(!kk.msgs.some(m=>m.d===today()&&m.t===lab)){ kk.msgs.push({d:today(),t:lab}); save(); lastMark={id:kk.id,d:today(),t:lab,g:mg}; }
    const n=nextUnsent(); const done=members.filter(sentToday).length;
    mt=null; if(n){mk=n.id;mkManual=false;}
    render(); haptic(15);
    if(n){ toast(`${done}/${members.length} sent. Next: ${n.name}`); }
    else { toast(`${grp.label}: all ${members.length} sent 🎉`); confetti(); haptic([20,50,20,50,30]); }
    return true;
  };
  $('#mm').onclick=markSent;
  $('#cmn').onclick=async()=>{ if(!mt) return toast('Choose a template first'); if(await copy(mx.value)) markSent(); };
  $('#cpw').onclick=async()=>{ if(await copy(mx.value)) openWeChat(); };
  const ub=$('#un'); if(ub) ub.onclick=()=>{
    const m=lastMark; if(!m) return; const kk=kid(m.id);
    if(kk){ for(let i=kk.msgs.length-1;i>=0;i--){ if(kk.msgs[i].d===m.d&&kk.msgs[i].t===m.t){ kk.msgs.splice(i,1); break; } } save(); }
    lastMark=null; mg=m.g; mk=m.id; mkManual=true; mt=null; render(); toast('Undone: '+(kk?kk.name:'')+' is back in the list');
  };
}

/* ---------- backup ---------- */
function vData(){
  $('#main').innerHTML=`<div class="panel"><div class="ph"><span class="dot g"></span>Backup</div>
   <p class="mute" style="margin-top:0">${SERVER?'Your data is stored on the Mac and shared with every device using this link. ':'Data lives in this browser only. '}Export a backup file regularly (weekly is fine) and keep it in iCloud or on the Desktop.</p>
   <div class="row"><button class="btn p" id="ex">Export backup (.json)</button>
   <button class="btn" id="csv">Export spreadsheet (.csv)</button>
   <label class="btn" style="margin:0;cursor:pointer">Import backup<input type="file" id="im" accept=".json" class="hide"></label></div>
   <p class="mute" style="margin-top:16px">Starting data: none. Import a backup file to load the group. Package balances are blank on purpose: the list shows attended over scheduled, not classes paid for. Set each balance once in Members, Edit.</p>
   <button class="btn s dgr" id="rs">Reset everything to starting data</button></div>`;
  const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();};
  $('#ex').onclick=()=>dl('roots-attendance-backup-'+today()+'.json',JSON.stringify(S),'application/json');
  $('#csv').onclick=()=>{const h=['Name','Parent','Attended','Total','Rate','Classes left','Group','Stopped','Payment pending','Last message','Note'];
    const r=S.kids.map(k=>{const a=att(k),x=rate(k);return [k.name,k.parent,a.a,a.t,x==null?'':Math.round(x*100)+'%',k.bal??'',GN[group(k)],k.stopped?'Y':'N',k.pay?'Y':'N',lastMsg(k)||'',k.note];});
    dl('roots-attendance-'+today()+'.csv','﻿'+[h,...r].map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');};
  $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!okState(o))throw 0;if(!confirm('Replace ALL the data on THIS phone with this file? Other phones are not changed.'))return;o.kids.forEach(k=>{ if(k.bal!=null&&k.bal<0) k.bal=0; });S=o;S.gen=Date.now();save();toast('Backup restored');tab='members';render();}catch(x){alert('Not a valid backup file');}});};
  $('#rs').onclick=()=>{if(confirm('Erase all attendance, balances and message history? If this app is shared, this also erases the shared copy on the Mac and on every phone.')){localStorage.removeItem(KEY);S=load();S.gen=Date.now();save();render();}};
}

initChrome();
render();

</script>
